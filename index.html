<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 外部への通信を禁止する。データは端末の外へ出ない。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="試聴POS">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<title>即売会試聴POS</title>
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app"></div>
<div id="demo" hidden>
  <video id="demo-video" muted playsinline></video>
  <p class="demo-hint">画面をタッチすると試聴できます</p>
</div>
<div id="portrait">iPad を横向きにしてください</div>
<div id="toast" hidden></div>
</body>
</html>
